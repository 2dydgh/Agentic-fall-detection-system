  <path d="M27 12 L27 5 L20 5" fill="none" stroke="#6e9ef8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M5 20 L5 27 L12 27" fill="none" stroke="#6e9ef8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M27 20 L27 27 L20 27" fill="none" stroke="#6e9ef8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Falling person (tilted 30°) -->
